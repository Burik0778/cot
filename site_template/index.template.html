<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COT · Состояние рынка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050609; --bg2:#090B11; --pane:#0E1118; --pane2:#131722; --pane3:#181D2A;
  --ln:#1A1F2B; --ln2:#252C3B;
  --tx:#F2F4F8; --tx2:#98A2B6; --tx3:#5A6478;
  --up:#26D97F; --dn:#FF5C55; --gd:#F0B429; --vi:#8B7CFF; --cy:#3ECFDA;
}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:rgba(139,124,255,.3)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.55 'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mn{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{color:var(--up)}.dn{color:var(--dn)}.t3{color:var(--tx3)}
.wrap{max-width:1440px;margin:0 auto;padding:0 26px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--vi);outline-offset:2px;border-radius:4px}
.hide{display:none!important}

/* шапка */
header{position:sticky;top:0;z-index:80;background:rgba(5,6,9,.88);backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--ln)}
.hd{display:flex;align-items:center;gap:18px;height:58px}
.lg{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.02em}
.lgd{width:7px;height:7px;border-radius:50%;background:var(--gd);box-shadow:0 0 10px var(--gd)}
.lg em{font-style:normal;font-weight:400;color:var(--tx3);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.sp{margin-left:auto}
.inp{background:var(--pane);border:1px solid var(--ln2);border-radius:8px;padding:7px 12px;color:var(--tx);font-size:13px;width:210px;transition:.16s}
.inp:focus{border-color:var(--vi);width:250px;outline:none}
.inp::placeholder{color:var(--tx3)}

.sgs{display:flex;gap:2px;background:var(--pane);padding:3px;border-radius:9px;border:1px solid var(--ln);flex-wrap:wrap}
.sg{padding:6px 12px;border-radius:6px;color:var(--tx2);font-size:12.5px;font-weight:500;transition:.14s;white-space:nowrap}
.sg:hover{color:var(--tx);background:var(--pane2)}
.sg.on{background:var(--tx);color:var(--bg);font-weight:600}
.sg b{opacity:.5;font-weight:500;font-size:10.5px;margin-left:5px}

.alert{border-radius:10px;padding:11px 16px;font-size:13px;margin:16px 0;border:1px solid}
.a-red{background:rgba(255,92,85,.07);border-color:rgba(255,92,85,.25);color:#FF9E99}
.a-gd{background:rgba(240,180,41,.06);border-color:rgba(240,180,41,.22);color:#F0C86A}

/* заголовки секций */
.h1{font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1.1}
.sub{color:var(--tx2);font-size:14px;margin-top:7px;max-width:80ch;line-height:1.6}
.eyb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gd);font-weight:600;margin-bottom:11px}

/* скринер */
.tbx{border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--pane);margin:22px 0 44px}
.tsc{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1020px}
thead th{background:var(--bg2);color:var(--tx3);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;padding:12px 14px;text-align:right;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--ln);transition:.14s}
thead th:first-child,thead th:nth-child(2){text-align:left}
thead th:hover{color:var(--tx2);background:var(--pane2)}
thead th.srt{color:var(--gd)}
tbody td{padding:13px 14px;text-align:right;border-bottom:1px solid rgba(26,31,43,.7);font-size:13.5px;white-space:nowrap}
tbody td:first-child,tbody td:nth-child(2){text-align:left}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--pane2)}
tbody tr:last-child td{border-bottom:0}
.inm{font-weight:600;font-size:14px;letter-spacing:-.01em}
.isy{font-size:10.5px;color:var(--tx3);margin-top:2px}
.sct{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:3px 8px;border:1px solid var(--ln2);border-radius:4px}
.pb{display:inline-flex;align-items:center;gap:10px}
.pt{width:74px;height:22px;background:var(--pane3);border-radius:4px;position:relative;overflow:hidden}
.pt i{position:absolute;top:0;bottom:0;width:2.5px;border-radius:2px;box-shadow:0 0 8px currentColor}
.pt u{position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,.07)}
.bdg{display:inline-block;font-size:10.5px;font-weight:600;padding:3.5px 10px;border-radius:20px;letter-spacing:.01em;border:1px solid}
.b-extreme{background:rgba(240,180,41,.1);color:var(--gd);border-color:rgba(240,180,41,.28)}
.b-reversal{background:rgba(139,124,255,.12);color:#A99BFF;border-color:rgba(139,124,255,.3)}
.b-crowded{background:rgba(255,92,85,.09);color:#FF8C86;border-color:rgba(255,92,85,.25)}
.b-accum{background:rgba(38,217,127,.09);color:var(--up);border-color:rgba(38,217,127,.25)}
.b-distrib{background:rgba(255,92,85,.07);color:#FF8C86;border-color:rgba(255,92,85,.2)}
.b-none{color:var(--tx3);border-color:transparent}

/* деталь */
.dhd{padding:22px 0 0}
.crm{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--tx3);flex-wrap:wrap;margin-bottom:14px}
.crm button{color:var(--vi);font-size:12.5px;font-weight:500}
.cp{font-size:10.5px;padding:3.5px 9px;border-radius:5px;background:var(--pane2);border:1px solid var(--ln2);color:var(--tx2);font-family:'JetBrains Mono',monospace}
.cp.r{background:rgba(255,92,85,.1);border-color:rgba(255,92,85,.28);color:#FF8C86}
.cp.g{background:rgba(38,217,127,.1);border-color:rgba(38,217,127,.28);color:var(--up)}
.dttl{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.dttl h1{font-size:36px;font-weight:600;letter-spacing:-.04em}
.dttl .sy{font-size:14px;color:var(--tx3);font-family:'JetBrains Mono',monospace}
.drg{color:var(--tx2);font-size:14px;margin-top:4px}

.tbs{display:flex;gap:2px;border-bottom:1px solid var(--ln);margin:22px 0 20px;overflow-x:auto}
.tb{padding:11px 16px;font-size:13.5px;font-weight:500;color:var(--tx3);border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;margin-bottom:-1px}
.tb:hover{color:var(--tx2)}
.tb.on{color:var(--tx);border-bottom-color:var(--gd)}

.ctl{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.cl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}

/* KPI */
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:13px;overflow:hidden;margin-bottom:16px}
.kc{background:var(--pane);padding:16px 18px;position:relative}
.kc:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc,transparent),transparent);opacity:.5}
.kk{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:9px;font-weight:600}
.kv{font-size:25px;font-weight:600;letter-spacing:-.04em;line-height:1}
.ks{font-size:11px;color:var(--tx3);margin-top:7px}

/* панели */
.pn{background:var(--pane);border:1px solid var(--ln);border-radius:13px;padding:20px 22px;margin-bottom:14px}
.pn.tight{padding:16px 18px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:3px;flex-wrap:wrap}
.pn h3{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.pn .ps{font-size:12px;color:var(--tx3);margin-bottom:16px;line-height:1.55}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:920px){.g2{grid-template-columns:1fr}}

.vd{font-size:23px;font-weight:600;letter-spacing:-.03em;line-height:1.28;margin-bottom:13px;
  background:linear-gradient(100deg,var(--tx) 30%,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
.pr{font-size:14.5px;color:var(--tx2);line-height:1.72}
.pr b{color:var(--tx);font-weight:600}
.ul{list-style:none;display:grid;gap:12px;margin-top:6px}
.ul li{font-size:13.5px;color:var(--tx2);padding-left:17px;position:relative;line-height:1.6}
.ul li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--dot,var(--tx3))}

/* шкала диапазона */
.st{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--ln)}
.st:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.sth{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:2px;flex-wrap:wrap}
.stn{font-size:14.5px;font-weight:600}
.str{font-size:11.5px;color:var(--tx3);margin-bottom:13px}
.trk{position:relative;height:40px;border-radius:8px;border:1px solid var(--ln2);overflow:hidden;
  background:linear-gradient(90deg,rgba(255,92,85,.16),rgba(90,100,120,.04) 42%,rgba(90,100,120,.04) 58%,rgba(38,217,127,.16))}
.trk u{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.055)}
.gh{position:absolute;top:50%;transform:translate(-50%,-50%);width:2px;height:14px;background:var(--tx2);opacity:.3;border-radius:1px}
.nw{position:absolute;top:50%;transform:translate(-50%,-50%);width:3px;height:100%;border-radius:2px;box-shadow:0 0 14px currentColor}
.nwl{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 3px var(--pane),0 0 18px currentColor}
.tf{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--tx3)}
.tf b{color:var(--tx);font-weight:600;font-family:'JetBrains Mono',monospace}

/* аналоги */
.acs{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.ac{background:var(--pane2);border:1px solid var(--ln2);border-radius:10px;padding:14px 15px;transition:.16s}
.ac:hover{border-color:var(--ln2);background:var(--pane3);transform:translateY(-2px)}
.ac .d{font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace}
.ac .s{font-size:10px;color:var(--tx3);margin-bottom:11px}
.ac .r{font-size:21px;font-weight:600;letter-spacing:-.035em;line-height:1}
.ac .l{font-size:10.5px;color:var(--tx3);margin-top:4px}

.brs{display:grid;gap:13px;margin:4px 0 18px}
.br{display:grid;grid-template-columns:186px 1fr 52px;gap:14px;align-items:center}
@media(max-width:700px){.br{grid-template-columns:1fr;gap:5px}.br .bv{text-align:left}}
.br .bl{font-size:12.5px;color:var(--tx2)}
.bt{height:22px;background:var(--pane3);border-radius:5px;overflow:hidden;position:relative}
.bf{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.bv{text-align:right;font-size:13.5px;font-weight:600}

details{background:var(--bg2);border:1px solid var(--ln);border-radius:13px;padding:15px 20px;margin:18px 0 46px}
summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;color:var(--tx2)}
summary::-webkit-details-marker{display:none}
summary:before{content:"＋ ";color:var(--gd);font-weight:400}
details[open] summary:before{content:"− "}
details .ul{margin-top:15px}

.dtb{overflow-x:auto;border:1px solid var(--ln);border-radius:13px;background:var(--pane)}
.dtb table{min-width:1180px}
.dtb th,.dtb td{font-size:12px;padding:9px 12px}
.dtb thead th{cursor:default}
.gp{background:rgba(38,217,127,.07)}.gn{background:rgba(255,92,85,.07)}



/* фактическая сводка */
.fct{margin-bottom:14px}
.fct h4{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:11px;display:flex;align-items:center;gap:9px}
.fct h4:before{content:"";width:3px;height:13px;border-radius:2px;background:var(--gd)}
.fct ul{list-style:none;display:grid;gap:9px}
.fct li{font-size:13.5px;color:var(--tx2);line-height:1.62;padding-left:16px;position:relative}
.fct li:before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--ln2)}
.fct li b{color:var(--tx);font-weight:600}

/* раскрытие графика на весь экран */
.exp{position:absolute;top:14px;right:16px;font-size:11px;color:var(--tx3);border:1px solid var(--ln2);
  border-radius:6px;padding:4px 10px;background:var(--pane2);transition:.15s;z-index:5}
.exp:hover{color:var(--tx);border-color:var(--vi)}
.pn{position:relative}
.modal{position:fixed;inset:0;z-index:200;background:rgba(3,4,7,.93);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .18s}
.modal.on{opacity:1;pointer-events:auto}
.mbox{background:var(--pane);border:1px solid var(--ln2);border-radius:16px;width:100%;max-width:1500px;
  max-height:94vh;overflow:auto;padding:24px 28px;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.mhd{display:flex;align-items:baseline;gap:14px;margin-bottom:4px;flex-wrap:wrap}
.mhd h3{font-size:19px;font-weight:600}
.mcl{margin-left:auto;font-size:22px;line-height:1;color:var(--tx3);padding:0 6px}
.mcl:hover{color:var(--tx)}

/* тултип на графиках */
.cw{position:relative}
.cw:hover .cx{opacity:1}
.cx{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.22);pointer-events:none;opacity:0;transition:opacity .1s}
.tt{position:absolute;z-index:40;background:rgba(9,11,17,.97);border:1px solid var(--ln2);border-radius:9px;padding:10px 13px;font-size:11.5px;pointer-events:none;opacity:0;transition:opacity .12s;min-width:150px;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.tt.on{opacity:1}
.tt .td{font-family:'JetBrains Mono',monospace;color:var(--tx3);font-size:10px;margin-bottom:7px;letter-spacing:.04em}
.tt .tr{display:flex;justify-content:space-between;gap:16px;margin-top:4px}
.tt .tr span{color:var(--tx2)}
.tt .tr b{font-family:'JetBrains Mono',monospace;font-weight:600}
.dotm{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--pane)}
.cw:hover .dotm{opacity:1}

/* раскрытый аналог */
.ac{cursor:pointer}
.ac.sel{border-color:var(--vi);background:var(--pane3);box-shadow:0 0 0 1px rgba(139,124,255,.3)}
.adt{margin-top:14px;border:1px solid var(--ln2);border-radius:12px;background:var(--pane2);padding:18px 20px}
.adh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.adh h4{font-size:17px;font-weight:600;font-family:'JetBrains Mono',monospace}
.adg{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
@media(max-width:820px){.adg{grid-template-columns:1fr}}
.cmp{width:100%;border-collapse:collapse}
.cmp th{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3);text-align:right;padding:6px 8px;font-weight:600;border-bottom:1px solid var(--ln)}
.cmp th:first-child{text-align:left}
.cmp td{font-size:12px;padding:7px 8px;text-align:right;border-bottom:1px solid rgba(26,31,43,.6)}
.cmp td:first-child{text-align:left;color:var(--tx2)}
.rt{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.rtc{background:var(--pane3);border:1px solid var(--ln2);border-radius:8px;padding:9px 13px;min-width:88px}
.rtc .k{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em}
.rtc .v{font-size:16px;font-weight:600;font-family:'JetBrains Mono',monospace;margin-top:3px}

.lgn{display:flex;gap:18px;flex-wrap:wrap;margin-top:13px;font-size:11.5px;color:var(--tx3)}
.lgn i{display:inline-block;width:14px;height:2.5px;border-radius:2px;margin-right:7px;vertical-align:middle}
footer{border-top:1px solid var(--ln);margin-top:44px;padding:24px 0 56px;color:var(--tx3);font-size:11.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header><div class="wrap hd">
  <div class="lg"><span class="lgd"></span>COT<em>состояние рынка</em></div>
  <div class="sgs" id="sec"></div>
  <div class="sp"></div>
  <input class="inp" id="q" placeholder="Поиск инструмента…" aria-label="Поиск">
</div></header>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<main class="wrap">
  <div id="ban"></div>
  <div id="scr"></div>
  <div id="det" class="hide"></div>
</main>

<footer class="wrap"><span id="bt"></span><span>CFTC · котировки FRED</span></footer>

<script>
const DATA=/*__DATA__*/null;
const MIN_N=20;
let sec="ALL",q="",sk="pct",sd=-1,cur=null,tab="dash",hz="8",per=104;

const $=i=>document.getElementById(i);
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const M=s=>E(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const pc=(x,d=1)=>x==null?"—":(x*100).toFixed(d)+"%";
const sp=(x,d=1)=>x==null?"—":(x>=0?"+":"")+(x*100).toFixed(d)+"%";
const nm=x=>x==null?"—":Math.round(x).toLocaleString("ru-RU").replace(/,/g," ");
const sn=x=>x==null?"—":(x>=0?"+":"")+Math.round(x).toLocaleString("ru-RU").replace(/,/g," ");
const tn=x=>x==null?"":(x>0?"up":x<0?"dn":"");
const zc=p=>p==null?"var(--tx3)":p>=80?"var(--up)":p<=20?"var(--dn)":"var(--gd)";
const SPEC=m=>m.participants.find(p=>p.is_spec)||{};
const SLOW=m=>m.participants.find(p=>p.is_slow)||{};

/* ─── графики: оси, сетка, свечение ─── */
const W=1000,PL=52,PR=14;
function scale(vals,h,pt,pb){
  const v=vals.filter(x=>x!=null);
  if(!v.length)return null;
  let mn=Math.min(...v),mx=Math.max(...v);
  if(mn===mx){mn-=1;mx+=1;}
  const pad=(mx-mn)*.08; mn-=pad; mx+=pad;
  return {mn,mx,y:val=>h-pb-((val-mn)/(mx-mn))*(h-pt-pb)};
}
function fmtAx(v,kind){
  if(kind==="k")return Math.abs(v)>=1000?(v/1000).toFixed(0)+"K":v.toFixed(0);
  if(kind==="p")return v.toFixed(v<10?2:0);
  return v.toFixed(1);
}
function grid(s,h,pt,pb,kind){
  if(!s)return "";
  let o="";
  for(let i=0;i<=3;i++){
    const val=s.mn+(s.mx-s.mn)*i/3, y=s.y(val);
    o+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#1A1F2B" stroke-width="1"/>`;
    o+=`<text x="${PL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" fill="#5A6478" font-size="10" font-family="JetBrains Mono,monospace">${fmtAx(val,kind)}</text>`;
  }
  return o;
}
function path(vals,s,h,glow,color,fill){
  if(!s)return "";
  const st=(W-PL-PR)/Math.max(vals.length-1,1);
  let d="",first=null,last=null;
  vals.forEach((v,i)=>{if(v==null)return;
    const x=PL+i*st,y=s.y(v);
    if(first===null)first=x; last=x;
    d+=(d?"L":"M")+x.toFixed(1)+","+y.toFixed(1)+" ";});
  if(!d)return "";
  let o="";
  if(fill)o+=`<path d="${d}L${last.toFixed(1)},${h} L${first.toFixed(1)},${h} Z" fill="url(#gr${fill})"/>`;
  if(glow)o+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="4" opacity=".18" filter="url(#bl)"/>`;
  return o+`<path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
}
function zline(s,h){
  if(!s||s.mn>0||s.mx<0)return "";
  const y=s.y(0);
  return `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#252C3B" stroke-dasharray="4 4"/>`;
}
function svg(h,inner){
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img">
    <defs><filter id="bl"><feGaussianBlur stdDeviation="4"/></filter>
      <linearGradient id="grgd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0B429" stop-opacity=".22"/><stop offset="1" stop-color="#F0B429" stop-opacity="0"/></linearGradient>
      <linearGradient id="grwt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F4F8" stop-opacity=".12"/><stop offset="1" stop-color="#F2F4F8" stop-opacity="0"/></linearGradient>
    </defs>${inner}</svg>`;
}

let TIP_SEQ=0;
/**
 * Оборачивает график в контейнер с наведением. При движении мыши считаем
 * ближайшую точку по X и показываем её значения. Данные для тултипа
 * кладём в data-атрибут как JSON — так одна функция обслуживает любой
 * набор серий, без отдельного кода под каждый график.
 */
function hoverable(svgHtml,hist,series,h){
  const id="cw"+(++TIP_SEQ);
  return `<div class="cw" id="${id}" data-h="${h}" data-series='${JSON.stringify(series).replace(/'/g,"&#39;")}'>
    ${svgHtml}<div class="cx"></div>${series.map((s,i)=>`<div class="dotm" data-i="${i}" style="background:${s.color}"></div>`).join("")}
    <div class="tt"></div></div>`;
}
function bindHover(root,hist){
  root.querySelectorAll(".cw").forEach(cw=>{
    const series=JSON.parse(cw.dataset.series||"[]"), h=+cw.dataset.h;
    const tip=cw.querySelector(".tt"), cx=cw.querySelector(".cx");
    const dots=[...cw.querySelectorAll(".dotm")];
    cw.addEventListener("mousemove",ev=>{
      const r=cw.getBoundingClientRect();
      const relX=(ev.clientX-r.left)/r.width;
      const px=relX*W;                         // координата во внутренней системе SVG
      const frac=(px-PL)/(W-PL-PR);
      const i=Math.max(0,Math.min(hist.length-1,Math.round(frac*(hist.length-1))));
      const st=(W-PL-PR)/Math.max(hist.length-1,1);
      const xPix=((PL+i*st)/W)*r.width;
      cx.style.left=xPix+"px";
      let rows="";
      series.forEach((s,k)=>{
        const v=hist[i][s.key], d=dots[k];
        if(v==null){d.style.opacity=0;return;}
        d.style.opacity=1;
        d.style.left=xPix+"px";
        d.style.top=(s.mn==null?0:((h-s.pb-((v-s.mn)/(s.mx-s.mn))*(h-s.pt-s.pb))/h)*r.height)+"px";
        rows+=`<div class="tr"><span>${s.label}</span><b style="color:${s.color}">${s.fmt==="pct"?sp(v):s.fmt==="z"?(v>=0?"+":"")+v.toFixed(2):s.fmt==="price"?v.toFixed(4):sn(v)}</b></div>`;
      });
      tip.innerHTML=`<div class="td">${hist[i].d}</div>${rows}`;
      tip.classList.add("on");
      const tw=tip.offsetWidth||170;
      tip.style.left=Math.min(Math.max(xPix+14,4),r.width-tw-4)+"px";
      tip.style.top="8px";
    });
    cw.addEventListener("mouseleave",()=>{tip.classList.remove("on");dots.forEach(d=>d.style.opacity=0);});
  });
}

function dateAxis(hist){
  if(hist.length<2)return "";
  const n=Math.min(6,hist.length),out=[];
  for(let i=0;i<n;i++){
    const idx=Math.round(i*(hist.length-1)/(n-1));
    out.push(hist[idx].d.slice(0,7));
  }
  return `<div style="display:flex;justify-content:space-between;padding:0 ${PR}px 0 ${PL}px;margin-top:7px;font-size:10px;color:var(--tx3);font-family:'JetBrains Mono',monospace">${out.map(d=>`<span>${E(d)}</span>`).join("")}</div>`;
}
function barsChart(vals,h){
  const v=vals.filter(x=>x!=null);
  if(!v.length)return svg(h,"");
  const mx=Math.max(...v.map(Math.abs))||1,mid=h/2;
  const bw=Math.max(1.4,(W-PL-PR)/vals.length*.68);
  let o=`<line x1="${PL}" y1="${mid}" x2="${W-PR}" y2="${mid}" stroke="#252C3B"/>`;
  o+=`<text x="${PL-8}" y="${mid+3.5}" text-anchor="end" fill="#5A6478" font-size="10" font-family="JetBrains Mono,monospace">0</text>`;
  vals.forEach((val,i)=>{if(val==null)return;
    const x=PL+i*((W-PL-PR)/vals.length),bh=Math.abs(val)/mx*(h/2-6);
    o+=`<rect x="${x.toFixed(1)}" y="${(val>=0?mid-bh:mid).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,.8).toFixed(1)}" rx="1" fill="${val>=0?"#26D97F":"#FF5C55"}" opacity=".8"/>`;});
  return svg(h,o);
}

function pCheck(m){
  const V=m.validation||[],P=m.precursors||[];
  if(!V.length)return `<div class="pn"><div class="pr">Для этого рынка нет ценового ряда — сверять движения не с чем.</div></div>`;
  const conds=[...new Map(V.map(x=>[x.cond_key,x])).values()];
  const evs=[...new Map(V.map(x=>[x.ev_key,x])).values()];
  vCond=vCond||conds[0].cond_key; vEv=vEv||evs[0].ev_key;
  const r=V.find(x=>x.cond_key===vCond&&x.ev_key===vEv)||V[0];
  const pr=P.find(x=>x.ev_key===vEv);
  const p=x=>x==null?"—":(x*100).toFixed(0)+"%";
  const num=x=>x==null?"—":(x>=0?"+":"")+Math.round(x).toLocaleString("ru-RU").replace(/,/g," ");

  const precursorBlock=!pr?"":`<div class="pn">
    <h3>Что происходило перед крупными движениями</h3>
    <div class="ps">Взяты ${pr.n_moves} самых крупных движений «${E(pr.event.toLowerCase())}» за всю историю.
      Показано, что творилось в отчётах за ${pr.weeks_before} недели до каждого — рядом с тем, что бывает
      в обычную неделю. Если колонки одинаковые, предвестника нет: участники просто всегда так делают.</div>
    <table class="cmp"><thead><tr><th>Показатель</th><th>За ${pr.weeks_before} нед. до движения</th><th>В обычную неделю</th><th>Разница</th></tr></thead>
      <tbody>${pr.metrics.map(x=>`<tr><td>${E(x.label)}</td>
        <td class="mn">${x.kind==="p"?Math.round(x.before):num(x.before)}</td>
        <td class="mn t3">${x.kind==="p"?Math.round(x.always):num(x.always)}</td>
        <td class="mn ${tn(x.diff)}">${x.kind==="p"?(x.diff>=0?"+":"")+x.diff.toFixed(0):num(x.diff)}</td></tr>`).join("")}</tbody></table>
    <h3 style="margin-top:22px">Какие признаки встречались перед движениями чаще обычного</h3>
    <div class="ps">Доля движений, перед которыми признак был, против того, как часто он бывает вообще.</div>
    <table class="cmp"><thead><tr><th>Признак</th><th>Перед движениями</th><th>Обычно</th><th>Разница</th></tr></thead>
      <tbody>${pr.conditions.slice(0,7).map(c=>`<tr><td>${E(c.cond)}</td>
        <td class="mn">${(c.share_before*100).toFixed(0)}%</td>
        <td class="mn t3">${(c.base_share*100).toFixed(0)}%</td>
        <td class="mn ${tn(c.diff_pp)}"><b>${(c.diff_pp>=0?"+":"")+c.diff_pp.toFixed(0)} п.п.</b></td></tr>`).join("")}</tbody></table>
    <div class="ps" style="margin-top:14px">Это подсказка, где искать, а не доказательство. Признак может встречаться
      перед движениями чаще и при этом всё равно давать много ложных срабатываний — это видно в таблице ниже.</div>
  </div>`;

  return `<div class="pn">
    <h3>Проверка на истории</h3>
    <div class="ps">Порог «крупного движения» подбирается под сам инструмент: это верхние 10–20%
      его собственных движений, а не одинаковые для всех проценты. Иначе для евро порог в 5%
      означал бы почти нулевую выборку, а для золота — рядовое колебание.</div>

      <span class="cl">Движение</span>
      <select id="ve">${evs.map(e=>`<option value="${e.ev_key}"${e.ev_key===vEv?" selected":""}>${E(e.ev)}</option>`).join("")}</select>
      <span class="cl">Признак в отчёте</span>
      <select id="vc">${conds.map(c=>`<option value="${c.cond_key}"${c.cond_key===vCond?" selected":""}>${E(c.cond)}</option>`).join("")}</select>
    </div>
    ${r.threshold_pts!=null?`<div class="alert a-gd">Порог для этого инструмента: <b>${Math.abs(r.threshold_pts).toLocaleString("ru-RU").replace(/,/g," ")} ${E(r.unit)}</b>
      (${(r.threshold_pct*100).toFixed(2)}%). Движения меньше этого крупными не считаются.</div>`:""}

    <table class="cmp" style="max-width:660px">

          <td class="mn dn" style="font-size:16px">${r.b}</td>
          <td class="mn"><b>${p(r.rate_with)}</b></td></tr>
        <tr><td>признака не было</td><td class="mn">${r.c}</td><td class="mn">${r.d}</td>

    </div>
    <div class="pr" style="margin-top:6px">${E(r.verdict)}</div>
    ${r.dates.length?`<details style="margin-top:16px"><summary>Даты, когда признак выполнялся (${r.dates.length} последних)</summary>
      <div class="mn t3" style="margin-top:12px;font-size:11.5px;line-height:2">${r.dates.map(d=>E(d)).join(" · ")}</div></details>`:""}
  </div>`;
}

      чем каждая линия по отдельности: когда медленные и быстрые деньги расходятся, направление ещё не решено.</div>
    ${hoverable(svg(360,grid(s,360,12,22,"k")+zline(s,360)+paths),h,
      ks.map(k=>({key:k,label:m.participants.find(p=>p.key===k).label,color:C[k]||"#5A6478",
        fmt:"n",mn:s&&s.mn,mx:s&&s.mx,pt:12,pb:22})),360)}
    ${dateAxis(h)}
    <div class="lgn">${m.participants.map(p=>`<span><i style="background:${C[p.key]||"#5A6478"}"></i>${E(p.label)}</span>`).join("")}</div></div>`;
}

const TCOLS=[["lc","Δ лонг"],["sc","Δ шорт"],["oi","Net/OI"],["nc","Δ нетто"],["np","Нетто"]];
const SROWS=[["MAX","макс."],["MIN","мин."],["MAX5Y","макс. 5л"],["MIN5Y","мин. 5л"],["AVG13W","сред. 13н"]];

function tcell(v,kind){
  if(v==null)return `<td class="mn t3">—</td>`;
  const txt=kind==="oi"?(v*100).toFixed(0)+"%":sn(v);
  // Заливка ячейки по знаку — как в референсе: глазами видно направление
  // потока по всей колонке, не читая каждое число.
  const bg=v>0?"gp":v<0?"gn":"";
  return `<td class="mn ${bg} ${tn(v)}">${txt}</td>`;
}

function pTbl(m){
  const ks=m.participants.map(p=>p.key);
  const S=m.table_stats||{};
  return `<div class="pn tight"><h3>Данные по неделям</h3>
    <div class="ps" style="margin:0">По каждой группе: изменение лонга и шорта за неделю, чистая позиция в процентах
      от открытого интереса, изменение нетто и сама чистая позиция. Сверху — исторические границы и среднее,
      чтобы видеть, насколько текущие значения обычны. Последние 80 отчётов, свежие сверху.</div></div>
  <div class="dtb"><table><thead>
    <tr><th style="text-align:left">Дата</th>${ks.map(k=>`<th colspan="5" style="text-align:center;border-left:1px solid var(--ln2)">${E(m.participants.find(p=>p.key===k).label)}</th>`).join("")}</tr>
    <tr><th></th>${ks.map(()=>TCOLS.map(([,l],i)=>`<th${i===0?' style="border-left:1px solid var(--ln2)"':''}>${l}</th>`).join("")).join("")}</tr></thead>
    <tbody>
      ${SROWS.map(([key,lbl])=>S[key]?`<tr style="background:var(--bg2)">
        <td class="mn t3" style="text-align:left;font-weight:600">${lbl}</td>
        ${ks.map(k=>TCOLS.map(([c],i)=>{const v=S[key][k+"_"+c];
          return `<td class="mn t3"${i===0?' style="border-left:1px solid var(--ln2)"':''}>${v==null?"—":c==="oi"?(v*100).toFixed(0)+"%":sn(v)}</td>`;}).join("")).join("")}
      </tr>`:"").join("")}
      ${m.table.map(r=>`<tr><td class="mn t3" style="text-align:left">${E(r.d)}</td>
        ${ks.map(k=>TCOLS.map(([c],i)=>{const v=r[k+"_"+c];
          if(v==null)return `<td class="mn t3"${i===0?' style="border-left:1px solid var(--ln2)"':''}>—</td>`;
          const txt=c==="oi"?(v*100).toFixed(0)+"%":sn(v);
          const bg=c==="np"?"":(v>0?"gp":v<0?"gn":"");
          return `<td class="mn ${bg} ${tn(v)}"${i===0?' style="border-left:1px solid var(--ln2)"':''}>${txt}</td>`;
        }).join("")).join("")}</tr>`).join("")}
    </tbody></table></div>`;
}

$("ban").innerHTML=DATA.synthetic?`<div class="alert a-red">Демо-режим: данные сгенерированы для проверки программы. Это не рынок.</div>`:"";
$("bt").textContent="Обновлено "+DATA.built;
$("q").oninput=e=>{q=e.target.value.toLowerCase().trim();if($("det").classList.contains("hide"))drawScr();};
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&MODAL)closeModal();});
drawSec();drawScr();
</script>
</body>
</html>
